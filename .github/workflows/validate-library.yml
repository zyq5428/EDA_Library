name: Validate library catalog

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check catalog and referenced files
        run: python scripts/validate_library.py
      - name: Check device export parser
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
